<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG System Blueprint</title>
<meta name="description" content="Interactive engineering blueprint of a database-integrated RAG system built during an AI Engineering internship at Orange Jordan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff8a2a'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h16' stroke='%231a0d02' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try{var t=JSON.parse(localStorage.getItem('rag.theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#0b0e14;--bg2:#10141c;--surface:#151a24;--surface2:#1b2230;--surface3:#232c3d;
  --line:#2a3345;--line2:#3a4660;--text:#e8ecf4;--muted:#a3aec2;--faint:#76829a;
  --accent:#ff8a2a;--accent-ink:#1a0d02;
  --ingest:#2dd4bf;--qa:#60a5fa;--retr:#a78bfa;--gen:#fb923c;--run:#f472b6;--eval:#4ade80;--prop:#94a3b8;
  --ok:#4ade80;--warn:#fbbf24;--team:#f472b6;
  --grid:rgba(148,163,184,.10);--shadow:0 10px 30px rgba(0,0,0,.45);--node:#171d29;--node-hi:#1f2737;
  --code-bg:#0d1119;--k:#c4b5fd;--s:#86efac;--n:#fdba74;--c:#76829a;--p:#7dd3fc;
  --r:12px;--panel-w:560px;
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f9;--bg2:#ebeef4;--surface:#ffffff;--surface2:#f4f6fa;--surface3:#e8ecf3;
  --line:#d6dce7;--line2:#b8c2d3;--text:#141a26;--muted:#4b566b;--faint:#6b7689;
  --accent:#c2540a;--accent-ink:#fff;
  --ingest:#0d9488;--qa:#2563eb;--retr:#7c3aed;--gen:#c2540a;--run:#db2777;--eval:#16a34a;--prop:#64748b;
  --ok:#15803d;--warn:#b45309;--team:#be185d;
  --grid:rgba(71,85,105,.13);--shadow:0 10px 30px rgba(30,41,59,.14);--node:#ffffff;--node-hi:#f5f7fb;
  --code-bg:#f4f6fa;--k:#6d28d9;--s:#15803d;--n:#b45309;--c:#6b7689;--p:#0369a1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
code{font-family:var(--mono);font-size:.88em;background:var(--surface3);padding:.08em .36em;border-radius:5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100%}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;white-space:nowrap;background:none;padding:0}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:15px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--faint);line-height:1.1}
.brand span.t{display:block;line-height:1.2;font-size:14px;text-align:left}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:7px 11px;border-radius:8px;color:var(--muted);font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:var(--surface3);color:var(--text);font-weight:600}
.search{position:relative;width:250px;flex:none}
.search input{width:100%;height:36px;padding:0 34px 0 34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);outline:0;font-size:13.5px}
.search input:focus{border-color:var(--accent)}
.search>svg{position:absolute;left:11px;top:10px;color:var(--faint);font-size:16px}
.search kbd{position:absolute;right:9px;top:8px;font:11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.results{position:absolute;top:42px;right:0;width:min(440px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:50}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
.results button.sel,.results button:hover{background:var(--surface3)}
.results b{font-weight:600;font-size:14px}
.results .kind{float:right;font-size:11px;color:var(--faint)}
.results p{margin:1px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.results mark{background:none;color:var(--accent);font-weight:600}
.results .none{padding:14px;color:var(--muted);font-size:13.5px}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:17px;flex:none;transition:background .15s,color .15s}
.iconbtn:hover{background:var(--surface3);color:var(--text)}

/* views */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#v-blueprint.on{display:flex;flex-direction:column}
.scroll{overflow:auto;height:100%;padding:28px 24px 64px}
.page{max-width:1120px;margin:0 auto}
.page>h1{font-size:27px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.page>.lead{color:var(--muted);margin:0 0 22px;max-width:760px}
h2.sec{font-size:17px;margin:32px 0 12px}

/* blueprint strip */
.strip{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);white-space:nowrap;transition:border-color .15s,color .15s}
button.chip:hover{border-color:var(--line2);color:var(--text)}
button.chip.on{border-color:var(--accent);color:var(--text)}
.chip b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.stage{flex:1;display:flex;min-height:0;position:relative}

/* outline */
.outline{width:286px;flex:none;border-right:1px solid var(--line);background:var(--bg2);overflow:auto;padding:12px 10px 40px;display:none}
.outline.on{display:block}
.outline h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 6px 4px;display:flex;align-items:center;gap:7px}
.outline h3 i{width:8px;height:8px;border-radius:3px;background:var(--c0)}
.outline h3:first-child{margin-top:2px}
.outline button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;font-size:13.5px;color:var(--muted)}
.outline button:hover{background:var(--surface2);color:var(--text)}
.outline button.sel{background:var(--surface3);color:var(--text);font-weight:600}
.outline .gr{font-weight:600;color:var(--text)}
.outline .ch{padding-left:30px}
.outline .tw{margin-left:auto;font-size:12px;color:var(--faint);padding:2px 4px;transition:transform .15s}
.outline .tw.shut{transform:rotate(-90deg)}

/* canvas */
.canvas{flex:1;min-width:0;position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:24px 24px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.canvas.drag{cursor:grabbing}
.canvas svg.dia{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{position:absolute;left:14px;bottom:14px;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);z-index:5}
.tools button{height:34px;min-width:34px;padding:0 8px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:16px}
.tools button:hover{background:var(--surface3);color:var(--text)}
.tools #zl{font:12px var(--mono);min-width:48px}
.tools .sep{width:1px;background:var(--line);margin:5px 3px}
.tip{position:absolute;z-index:8;max-width:280px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:9px 12px;font-size:13px;line-height:1.42;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{display:block;font-size:13.5px;margin-bottom:2px}
.tip span{color:var(--muted)}

/* svg diagram */
.lane rect{fill:var(--c0);fill-opacity:.035;stroke:var(--c0);stroke-opacity:.3;stroke-width:1.2}
.lane text{fill:var(--c0);font:700 14px var(--sans);letter-spacing:.09em}
.lanehit{cursor:pointer}
.lanehit:hover text{text-decoration:underline}
.grp>rect.box{fill:var(--c0);fill-opacity:.04;stroke:var(--c0);stroke-opacity:.45;stroke-dasharray:5 5;stroke-width:1.2}
.grp .gh{cursor:pointer}
.grp .gh text{fill:var(--text);font:650 13.5px var(--sans)}
.grp .gh:hover text{fill:var(--c0)}
.grp .tog{cursor:pointer}
.grp .tog rect{fill:var(--surface2);stroke:var(--line2)}
.grp .tog:hover rect{stroke:var(--c0)}
.grp .tog path{stroke:var(--text);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.node{cursor:pointer;transition:opacity .2s}
.node .bg{fill:var(--node);stroke:var(--line2);stroke-width:1.2;filter:drop-shadow(0 3px 7px rgba(0,0,0,.22));transition:fill .15s,stroke .15s}
.node .bar{fill:var(--c0)}
.node .ttl{fill:var(--text);font:650 15.5px var(--sans)}
.node .sub{fill:var(--muted);font:12.2px var(--sans)}
.node .ico{color:var(--c0)}
.node .cap{fill:var(--c0);font:700 10.5px var(--mono);letter-spacing:.04em}
.node .scr{fill:var(--c0);font:750 19px var(--sans);text-anchor:end}
.node:hover .bg,.node:focus-visible .bg{fill:var(--node-hi);stroke:var(--c0)}
.node:focus{outline:0}
.node.sel .bg{stroke:var(--c0);stroke-width:2.6;fill:var(--node-hi)}
.node.prop .bg{stroke-dasharray:6 5;fill-opacity:.55}
.node.team .bg{stroke-dasharray:2 4}
.node.match .bg{stroke:var(--accent);stroke-width:2.6}
.dia.focus .node:not(.lit):not(.sel),.dia.focus .edge:not(.lit),.dia.focus .elabel:not(.lit){opacity:.2}
.edge{color:var(--c0);transition:opacity .2s}
.edge path.l{fill:none;stroke:currentColor;stroke-width:1.9;stroke-opacity:.72;stroke-linejoin:round}
.edge polygon{fill:currentColor;fill-opacity:.9}
.edge.dash path.l{stroke-dasharray:6 5}
.edge.lit path.l{stroke-opacity:1;stroke-width:2.8;stroke-dasharray:9 7;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.elabel{transition:opacity .2s;pointer-events:none}
.elabel rect{fill:var(--bg);stroke:var(--line)}
.elabel text{fill:var(--muted);font:11.5px var(--sans);text-anchor:middle}

/* side panel */
.panel{width:0;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .24s cubic-bezier(.2,.7,.2,1);z-index:12}
.panel.on{width:var(--panel-w)}
.pin{width:var(--panel-w);display:flex;flex-direction:column;height:100%;min-height:0}
.phead{padding:14px 18px 0;border-bottom:1px solid var(--line);flex:none;border-top:3px solid var(--c0)}
.crumb{font-size:12px;color:var(--faint);display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding-right:40px}
.crumb button{color:var(--faint);padding:0}
.crumb button:hover{color:var(--text);text-decoration:underline}
.phead h2{font-size:22px;line-height:1.22;margin:5px 0 7px;display:flex;gap:10px;align-items:center;letter-spacing:-.005em}
.phead h2 .ic{color:var(--c0);font-size:22px}
.pclose{position:absolute;right:10px;top:10px}
.pin{position:relative}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.badge.impl{color:var(--ok)}.badge.prop{color:var(--warn)}.badge.team{color:var(--team)}.badge.me{color:var(--qa)}.badge.part{color:var(--retr)}
.nr{font-size:11.5px;font-weight:600;color:var(--warn);border:1px dashed currentColor;padding:1px 7px;border-radius:6px;white-space:nowrap}
.ptabs{display:flex;gap:2px}
.ptabs button{padding:7px 12px;color:var(--muted);font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--text);border-color:var(--c0);font-weight:600}
.pbody{flex:1;overflow:auto;padding:14px 18px 20px;min-height:0;scroll-behavior:smooth}
.pfoot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);flex:none;background:var(--bg2)}
.pfoot button{flex:1;display:flex;align-items:center;gap:6px;min-width:0;padding:7px 9px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.pfoot button:hover:not(:disabled){border-color:var(--line2);color:var(--text)}
.pfoot button:disabled{opacity:.4;cursor:default}
.pfoot button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfoot .nx{justify-content:flex-end}
.pfoot em{font:12px var(--mono);color:var(--faint);white-space:nowrap}
.short{font-size:15.5px;color:var(--text);margin:0 0 14px}
.io{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:0 0 14px}
.io>div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px}
.io small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.io>svg{align-self:center;color:var(--faint)}
details.s{border:1px solid var(--line);border-radius:var(--r);margin:0 0 9px;background:var(--surface);overflow:hidden}
details.s>summary{list-style:none;cursor:pointer;padding:10px 13px;font-weight:620;font-size:14.5px;display:flex;align-items:center;gap:8px}
details.s>summary::-webkit-details-marker{display:none}
details.s>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);transition:transform .15s}
details.s[open]>summary::after{transform:rotate(45deg)}
details.s>summary:hover{background:var(--surface2)}
.sb{padding:2px 14px 13px;font-size:14.2px}
.sb p{margin:0 0 9px}
.sb p:last-child{margin-bottom:0}
.sb ul,.sb ol{margin:0 0 9px;padding-left:19px}
.sb li{margin:2px 0}
.kv{width:100%;border-collapse:collapse;font-size:13.5px;margin:2px 0 9px}
.kv th,.kv td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.kv th{font-weight:600;color:var(--muted);font-size:12.5px}
.kv tr:last-child td{border-bottom:0}
.tw-wrap{overflow-x:auto}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:2px 0 9px}
.cmp>div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface2);font-size:13.3px}
.cmp b{display:block;margin-bottom:2px}
.cmp .pick{border-color:var(--c0)}
.cmp .pick b::after{content:" · selected";color:var(--c0);font-size:11.5px;font-weight:600}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 9px}
.pc>div{border-radius:10px;padding:9px 11px;font-size:13.3px;background:var(--surface2);border:1px solid var(--line)}
.pc h5{margin:0 0 3px;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.pc .y h5{color:var(--ok)}.pc .n h5{color:var(--warn)}
.pc ul{margin:0;padding-left:16px}
.note{border-left:3px solid var(--warn);background:var(--surface2);padding:8px 12px;border-radius:0 9px 9px 0;font-size:13.3px;margin:2px 0 9px}
.note.info{border-color:var(--qa)}
.fx{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;margin:2px 0 9px;overflow-x:auto;font-size:19px}
.fx math{font-size:1em}
#panel .fx{font-size:15.5px;padding:14px 8px}
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:0;margin:2px 0 9px;overflow:hidden}
pre.code .h{display:flex;justify-content:space-between;align-items:center;font:11.5px var(--sans);color:var(--faint);padding:5px 10px;border-bottom:1px solid var(--line)}
pre.code .h button{font-size:11.5px;color:var(--muted)}
pre.code .h button:hover{color:var(--text)}
pre.code code{display:block;background:none;padding:10px 12px;overflow-x:auto;font-size:12.8px;line-height:1.55;tab-size:2}
.t-k{color:var(--k)}.t-s{color:var(--s)}.t-n{color:var(--n)}.t-c{color:var(--c);font-style:italic}.t-p{color:var(--p)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 9px}
.lk{display:inline-flex;gap:6px;align-items:center;font-size:12.8px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
.lk:hover{border-color:var(--c1,var(--accent))}
.lk i{width:7px;height:7px;border-radius:2px;background:var(--c1,var(--accent))}
.sub-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 0}
.tag{font-size:11.5px;color:var(--muted);background:var(--surface3);padding:1px 7px;border-radius:5px}

/* QA */
.qa{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--surface)}
.qa summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:600;font-size:14.2px;display:flex;gap:9px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"Q";font:700 11.5px var(--mono);color:var(--accent);margin-top:3px}
.qa .a{padding:0 12px 11px 30px;color:var(--muted);font-size:14px}
.qa .a p{margin:0 0 7px}
.qa .act{display:flex;gap:8px;align-items:center;margin-top:7px}
.qa .act button{font-size:12.5px;color:var(--muted);border:1px solid var(--line);padding:2px 9px;border-radius:7px}
.qa .act button:hover{color:var(--text);border-color:var(--line2)}
.qa .act button.done{color:var(--ok);border-color:var(--ok)}
.qa.known>summary{color:var(--muted)}

/* cards & grids */
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.metric{cursor:pointer;text-align:left;transition:border-color .15s,transform .15s;display:block;width:100%}
.metric:hover{border-color:var(--c0);transform:translateY(-1px)}
.metric.on{border-color:var(--c0)}
.mhead{display:flex;align-items:center;gap:14px}
.gauge{width:84px;height:84px;flex:none}
.gauge circle{fill:none;stroke-width:9}
.gauge .tr{stroke:var(--surface3)}
.gauge .va{stroke:var(--eval);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .7s cubic-bezier(.2,.7,.2,1)}
.gauge text{fill:var(--text);font:750 21px var(--sans);text-anchor:middle}
.detail{margin-top:12px}
.seg{display:inline-flex;gap:2px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg button{padding:4px 11px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface3);color:var(--text);font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.toolbar .prog{font-size:13px;color:var(--muted)}
.stack-row{display:grid;grid-template-columns:210px 1fr auto;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left;font-size:14px}
.stack-row:last-child{border-bottom:0}
.stack-row:hover{background:var(--surface2)}
.stack-row b{font-weight:640}
.stack-row span{color:var(--muted)}
.stack-row em{font-style:normal;font-size:12px;color:var(--c0);white-space:nowrap}
.dec{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:0 0 10px;overflow:hidden;border-left:3px solid var(--c0)}
.dec>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.dec>summary::-webkit-details-marker{display:none}
.dec .q{font-size:12.5px;color:var(--faint)}
.dec .an{font-weight:640;font-size:15.5px;grid-column:1}
.dec .lk2{grid-row:1 / span 2;grid-column:2;align-self:center}
.dec .b{padding:0 16px 14px;font-size:14.2px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.resp{width:100%;border-collapse:collapse;font-size:14px}
.resp th,.resp td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.resp th{font-size:12.5px;color:var(--muted);font-weight:600}
.resp tr.clk{cursor:pointer}
.resp tr.clk:hover td{background:var(--surface2)}
.gapitem{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.gapitem:last-child{border-bottom:0}
.gapitem:hover{background:var(--surface2)}
.gapitem em{margin-left:auto;font-style:normal;font-size:12px;color:var(--faint);white-space:nowrap}
.pitch{font-size:15px;color:var(--text)}
.pitch p{margin:0 0 9px}

/* demos */
.demo{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--surface2);margin:2px 0 9px;font-size:13.5px}
.demo h5{margin:0 0 2px;font-size:13.5px}
.demo .hint{color:var(--faint);font-size:12px;margin:0 0 9px}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:9px;font-size:12.8px;color:var(--muted)}
.ctl input[type=range]{width:130px;accent-color:var(--accent);vertical-align:middle}
.ctl b{color:var(--text);font-variant-numeric:tabular-nums}
.rrf{width:100%;border-collapse:collapse;font-size:13px}
.rrf th,.rrf td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.rrf th{font-size:11.5px;color:var(--faint);font-weight:600}
.rrf select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 3px;font-size:12.5px}
.rrf .top td{background:color-mix(in srgb,var(--retr) 14%,transparent)}
.rrf td.num{font:12.5px var(--mono)}
.bar-w{height:7px;background:var(--surface3);border-radius:4px;min-width:50px;overflow:hidden}
.bar-w i{display:block;height:100%;background:var(--retr);transition:width .2s}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.slots button{width:46px;height:46px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font:600 15px var(--mono)}
.slots button.rel{border-color:var(--eval);color:var(--eval)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res>div{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.res b{display:block;font-size:17px;color:var(--text)}
.res .bad b{color:var(--warn)}
.claim{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface);font-size:13.2px}
.claim.y{border-color:var(--ok)}.claim.n{border-color:var(--warn)}
.claim small{display:block;color:var(--muted);font-size:12px}
.mx{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.mx button{text-align:left;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);font-size:12.8px;color:var(--muted)}
.mx button b{display:block;color:var(--text);font-size:13.2px}
.mx button.on{border-color:var(--c0);box-shadow:0 0 0 1px var(--c0)}
.mx-out{margin-top:8px;font-size:13.3px}

.fs .topbar{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--line2);padding:6px 13px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

@media (max-width:1180px){:root{--panel-w:480px}.search{width:190px}.search kbd{display:none}.legend{display:none}}
@media (max-width:900px){
  .brand small,.brand span.t{display:none}
  .topbar{gap:8px;padding:0 10px}
  .nav button svg{display:none}
  .search{width:150px}
  .g3,.tri{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
  .stack-row{grid-template-columns:1fr}
}
@media (max-width:760px){
  :root{--panel-w:100vw}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 16px;row-gap:6px}
  .nav{order:5;flex-basis:100%}
  .search{flex:1;width:auto}
  .panel{position:fixed;left:0;right:0;bottom:0;top:0;width:100vw;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.7,.2,1);border:0;z-index:40;visibility:hidden}
  .panel.on{width:100vw;transform:none;visibility:visible}
  .outline{position:absolute;inset:0;width:100%;z-index:6;padding-left:16px;padding-right:16px}
  .scroll{padding:20px 16px 64px}
  .tools{left:8px;bottom:8px}
  .pc,.res{grid-template-columns:1fr}
  .io{grid-template-columns:1fr}.io>svg{display:none}
  .tip{display:none}
  .page>h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{body{overflow:visible}}

<body>
<div id="app">
 <header class="topbar">
  <button class="brand" aria-label="Open project overview"><span class="mark"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg></span><span><span class="t">RAG System Blueprint</span><small>Orange Jordan internship</small></span></button>
  <nav class="nav" id="nav" aria-label="Views"></nav>
  <div class="search"><span id="searchIcon"></span><input id="q" type="search" placeholder="Search the project" aria-label="Search components, technologies and concepts" autocomplete="off"><kbd>/</kbd><div class="results" id="results"></div></div>
  <button class="iconbtn" id="themeBtn"></button>
 </header>
 <main>
  <section class="view" id="v-blueprint">
   <div class="strip" id="strip"></div>
   <div class="stage">
    <aside class="outline" id="outline" aria-label="Component outline"></aside>
    <div class="canvas" id="canvas">
     <svg class="dia" id="dia" role="application" aria-label="RAG system architecture diagram"><g id="world"></g></svg>
     <div class="tools" id="tools"></div>
     <div class="tip" id="tip"></div>
    </div>
    <aside class="panel" id="panel" aria-label="Component details"><div class="pin"></div></aside>
   </div>
  </section>
  <section class="view" id="v-evaluation"></section>
  <section class="view" id="v-stack"></section>
  <section class="view" id="v-decisions"></section>
  <section class="view" id="v-contrib"></section>
  <section class="view" id="v-interview"></section>
  <section class="view" id="v-roadmap"></section>
  <section class="view" id="v-gaps"></section>
 </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ---------- content helpers ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const P=s=>`<p>${s}</p>`;
const UL=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const OL=a=>`<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
const KV=(rows,head)=>`<div class="tw-wrap"><table class="kv">${head?`<tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>`:''}${rows.map(r=>`<tr>${r.map((c,i)=>(!head&&i==0)?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const CMP=a=>`<div class="cmp">${a.map(([t,d,pick])=>`<div class="${pick?'pick':''}"><b>${t}</b>${d}</div>`).join('')}</div>`;
const PC=(y,n,yt='Strengths',nt='Limitations')=>`<div class="pc"><div class="y"><h5>${yt}</h5>${UL(y)}</div><div class="n"><h5>${nt}</h5>${UL(n)}</div></div>`;
const NOTE=(s,info)=>`<div class="note ${info?'info':''}">${s}</div>`;
const NR=(s='Not recorded')=>`<span class="nr">${s}</span>`;
const CODE=(src,lang,label)=>`<pre class="code" data-lang="${lang}"><div class="h"><span>${label}</span><button data-copy>Copy</button></div><code>${esc(src)}</code></pre>`;
const FX=m=>`<div class="fx"><math display="block">${m}</math></div>`;
const mi=s=>`<mi>${s}</mi>`, mn=s=>`<mn>${s}</mn>`, mo=s=>`<mo>${s}</mo>`, mt=s=>`<mtext>${s}</mtext>`;
const frac=(a,b)=>`<mfrac><mrow>${a}</mrow><mrow>${b}</mrow></mfrac>`;
const sub=(a,b)=>`<msub>${a}${b}</msub>`;

const F_RRF=FX(`<mrow>${mi('RRF')}<mo>(</mo>${mi('d')}<mo>)</mo><mo>=</mo><munder><mo>∑</mo>${mi('i')}</munder>${frac(sub(mi('w'),mi('i')),mi('k')+'<mo>+</mo>'+sub(mi('r'),mi('i'))+'<mo>(</mo>'+mi('d')+'<mo>)</mo>')}</mrow>`);
const F_HIT=FX(`<mrow>${mt('HitRate@5')}<mo>=</mo>${frac(mt('Questions with a relevant result in top 5'),mt('Total questions'))}<mo>×</mo>${mn('100')}</mrow>`);
const F_REC=FX(`<mrow>${mt('Recall@5')}<mo>=</mo>${frac(mt('Relevant results retrieved in top 5'),mt('Total relevant results'))}</mrow>`);
const F_FAITH=FX(`<mrow>${mt('Faithfulness')}<mo>=</mo>${frac(mt('Claims supported by retrieved context'),mt('Total claims in the answer'))}</mrow>`);
const RRF_VARS=KV([['<i>d</i>','A retrieved document or chunk'],['<i>w<sub>i</sub></i>','Weight of retrieval method <i>i</i>'],['<i>r<sub>i</sub></i>(<i>d</i>)','The document\'s ranking position in that method'],['<i>k</i>','Rank-smoothing constant (project value '+NR()+')'],['<i>w</i><sub>Dense</sub>','<b>0.7</b>'],['<i>w</i><sub>BM25</sub>','<b>0.3</b>']]);

const NOTIMPL=NOTE('<b>Proposed, not implemented.</b> This is a possible scaling or future improvement. It is not a claim about the original system.');

/* ---------- stages ---------- */
const LANES={
  ingest:{title:'Document Ingestion',color:'--ingest'},
  qa:{title:'Question Answering',color:'--qa'},
  run:{title:'Packaging & Runtime',color:'--run'},
  eval:{title:'Evaluation',color:'--eval'},
  prop:{title:'Proposed Improvements',color:'--prop'}
};
const OWN={me:['me','Developed by me'],part:['part','I contributed'],team:['team','Handled by senior engineers']};
const STAT={impl:['impl','Implemented'],prop:['prop','Proposed, not implemented'],concept:['impl','Project process']};

/* ---------- components ---------- */
const COMPONENTS=[];
const C=(id,o)=>COMPONENTS.push(Object.assign({id,status:'impl',own:'me',tags:[],secs:[],qa:[]},o));

/* overview entries */
C('project',{title:'Project Overview',kind:'overview',lane:'qa',icon:'blueprint',own:'me',
 short:'A Retrieval-Augmented Generation system that let employees of a client company ask natural-language questions about their internal PDF documents and get answers with references to the original sources.',
 tags:['Orange Jordan','AI Engineering internship','RAG','overview'],
 secs:[
  ['Final results',KV([['Hit Rate@5','<b>91%</b>'],['Recall@5','<b>89%</b>'],['Faithfulness','<b>93%</b>']])+P('Obtained using an internal ground-truth evaluation dataset provided by the client company.')],
  ['Scope of my work',P('I developed the RAG pipeline under the supervision of senior engineers, including document processing, embedding generation, vector database integration, hybrid retrieval, LLM integration and performance evaluation. Senior engineers handled the frontend and deployment.')],
  ['The two processes',UL(['<b>Document ingestion:</b> preparing and storing company documents. This builds the knowledge base.','<b>Question answering:</b> retrieving information and generating answers from that knowledge base.'])],
  ['How to use this blueprint',UL(['Click any card, lane title or group title to open its details.','Use the chevron on a group to collapse it into one block.','Use the arrow keys or the Previous/Next buttons to walk the pipeline in order.','Press <code>/</code> to search and <code>Esc</code> to close this panel.'])]
 ],
 qa:[['Summarise the project in under a minute.','During my AI Engineering internship at Orange Jordan I developed a RAG system that let a client company\'s employees ask questions about internal PDFs. I extracted text with LangChain and Unstructured, cleaned it, used heading-based chunking at up to 1,000 characters with 100 overlap, embedded chunks with <code>gemini-embedding-001</code> and stored them in ChromaDB. Retrieval combined 70% dense and 30% BM25 through <code>EnsembleRetriever</code> and RRF. The top five chunks went to Gemini in a Stuffing prompt. Against the client\'s ground truth it reached 91% Hit Rate@5, 89% Recall@5 and 93% faithfulness.'],
 ['What exactly did you own versus your team?','I developed the pipeline under senior supervision: document processing, embeddings, ChromaDB, hybrid retrieval, Gemini integration, and evaluation. I contributed to the FastAPI backend, Docker and dependency management. Senior engineers handled the frontend and deployment.']]});

C('lane-ingest',{title:'Document Ingestion Pipeline',kind:'lane',lane:'ingest',icon:'layers',
 short:'Prepares the knowledge base: PDFs are extracted, cleaned, chunked, embedded and stored in ChromaDB.',
 tags:['pipeline','architecture'],
 secs:[['Data flow',CODE(`Company PDF Documents
  -> PDF Extraction (LangChain + Unstructured)
  -> Text Cleaning (Python rule-based preprocessing)
  -> Heading-Based Chunking (max 1,000 chars, overlap 100)
  -> Gemini Embedding Model (gemini-embedding-001)
  -> ChromaDB (Embeddings + Text + Metadata)`,'text','Ingestion flow')],
 ['Link to question answering',P('ChromaDB serves dense search, and the chunks are what BM25 searches over. Everything the question-answering pipeline retrieves comes from this pipeline.')]],
 qa:[['Why separate ingestion from question answering?','They do different jobs: ingestion prepares and stores the documents, and question answering uses that knowledge base. It also means I could propose moving ingestion into background jobs at scale so that PDF processing does not block user queries.']]});

C('lane-qa',{title:'Question-Answering Pipeline',kind:'lane',lane:'qa',icon:'chat',
 short:'Takes an employee question through FastAPI, hybrid retrieval, prompt construction and Gemini, then returns an answer with source references as JSON.',
 tags:['pipeline','architecture'],
 secs:[['Data flow',CODE(`Employee's Question
  -> FastAPI
  -> Hybrid Retrieval
       Dense Search (ChromaDB)  weight 0.7
       BM25 Search (Keywords)   weight 0.3
  -> EnsembleRetriever + Reciprocal Rank Fusion
  -> Top 5 Chunks
  -> Prompt (Instructions + Context + Question)
  -> Google Gemini
  -> Generated Answer + Source References
  -> FastAPI JSON Response
  -> User`,'text','Question-answering flow')]]});

C('business',{title:'Business Problem',sub:'Knowledge locked in PDFs',lane:'ingest',icon:'target',status:'concept',own:'me',
 short:'Important company and customer information sat across multiple PDFs, and employees needed quick access without opening and searching each document.',
 tags:['problem','solution','RAG vs LLM','fine-tuning','why RAG'],
 secs:[
  ['The problem',P('The client company had important information stored across multiple PDF documents, including information about the company and its customers. Employees needed a way to access it quickly without manually opening and searching through documents.')],
  ['The solution',OL(['Process the company\'s PDF documents.','Split their content into smaller, searchable chunks.','Convert those chunks into numerical embeddings.','Store the embeddings in a vector database.','Retrieve relevant information when an employee asks a question.','Use Google Gemini to generate an answer based on the retrieved information.','Provide references to the original documents.'])],
  ['Why RAG instead of a standard LLM?',P('A general-purpose LLM does not automatically have access to a company\'s private documents. RAG retrieves relevant company information and provides it to the LLM when generating an answer.')],
  ['Why not fine-tuning?',P('Fine-tuning was not necessary because the main requirement was to give the model access to company-specific knowledge, rather than fundamentally change its behaviour.')+CMP([['RAG','Documents update without retraining the LLM. Responses are grounded in company documents. Source references are possible. Relatively cost-effective and easier to maintain.',1],['Fine-tuning','Could still be useful for other requirements, but was not needed for this use case.']])]
 ],
 qa:[['Why RAG rather than fine-tuning?','The need was access to company-specific knowledge, not a change in model behaviour. RAG lets documents be updated without retraining, grounds responses in the documents, supports source references, and was relatively cost-effective and easier to maintain.'],
 ['Why not just use a general LLM?','It has no automatic access to the company\'s private documents. RAG retrieves the relevant information and gives it to the LLM at answer time.']]});

C('pdfs',{title:'Company PDFs',sub:'Internal documents',lane:'ingest',icon:'file',status:'concept',own:'team',ownText:'Provided by the client company',
 short:'The client company\'s internal PDF documents, which formed the knowledge base for the RAG system.',
 tags:['data source','PDF','knowledge base'],io:['Client company','Raw PDF files'],
 secs:[['Data source',P('The company provided its internal documents in PDF format. These documents formed the knowledge base for the RAG system.')+KV([['Format','PDF'],['Content','Information about the company and its customers'],['Number of documents',NR()],['Languages','Embedding model chosen for English and Arabic capability; the language mix of the corpus is '+NR()]])]]});

C('docproc',{title:'Document Processing',kind:'group',lane:'ingest',icon:'layers',
 short:'The stage that turns raw PDFs into clean, structured chunks with source metadata.',
 tags:['pdf','cleaning','chunking','metadata'],children:['extract','clean','chunk','meta'],
 secs:[['Stage summary',KV([['PDF extraction','LangChain + Unstructured'],['Text cleaning','Python rule-based preprocessing'],['Chunking','Heading-based, max 1,000 chars, 100 overlap'],['Metadata','Source, page number, section heading']])]]});

C('extract',{title:'PDF Extraction',sub:'LangChain + Unstructured',lane:'ingest',group:'docproc',icon:'scan',
 short:'Converts PDF content into text that the rest of the RAG pipeline can process.',
 tags:['Unstructured','LangChain','PDF','loader'],io:['Company PDF files','Extracted text + source details'],
 secs:[['What it does',P('I used <b>LangChain with the Unstructured document-processing library</b> to extract content from the PDFs, converting it into text the RAG pipeline could process.')],
 ['Configuration',KV([['Framework','LangChain'],['Library','Unstructured'],['Exact loader class',NR()]])]],
 qa:[['How did you read the PDFs?','With LangChain and the Unstructured library, which extracted the PDF content into text for the pipeline. The exact loader class is not recorded, so check the code before quoting one.']]});

C('clean',{title:'Text Cleaning',sub:'Rule-based Python',lane:'ingest',group:'docproc',icon:'broom',
 short:'Rule-based Python preprocessing that prepares clean, useful text for chunking and retrieval.',
 tags:['preprocessing','whitespace','artefacts'],io:['Raw extracted text','Clean text with metadata kept'],
 secs:[['What it does',UL(['Removes unnecessary whitespace.','Removes unwanted formatting artefacts.','Preserves important document information.','Maintains relevant metadata for source identification.'])+P('The goal was to prepare clean, useful text for chunking and retrieval.')],
 ['Implementation',KV([['Method','Rule-based'],['Language','Python'],['Exact rules',NR()]])]]});

C('chunk',{title:'Heading-Based Chunking',sub:'Max 1,000 · overlap 100',lane:'ingest',group:'docproc',icon:'cut',
 short:'Divides documents into smaller sections along their headings, preserving logical structure rather than cutting everything into unrelated pieces.',
 tags:['chunk size','overlap','1000','100','LangChain','splitter'],io:['Clean text + metadata','Chunks of up to 1,000 characters'],
 secs:[
  ['Configuration',KV([['Strategy','Heading-based, through LangChain'],['Maximum chunk size','<b>1,000 characters</b>'],['Chunk overlap','<b>100 characters</b>'],['Exact splitter class',NR()],['Heading detection and overlap method',NR()]])],
  ['Why chunk at all?',P('LLMs and retrieval systems work better when relevant information can be retrieved in manageable sections. Rather than retrieving an entire PDF, the system retrieves only the sections most relevant to the employee\'s question.')],
  ['Why a maximum of 1,000 characters?',P('A practical balance between:')+UL(['Preserving sufficient information within each chunk.','Keeping retrieval results focused.','Avoiding excessively large amounts of context.'])],
  ['Why 100 characters of overlap?',P('Overlap helps preserve information that might otherwise be separated at chunk boundaries. If an explanation starts near the end of one chunk and continues into the next, overlap can help maintain continuity.')],
  ['How the settings interact',NOTE('Heading-based chunking preserves document structure, while maximum chunk size and overlap control how longer sections are divided. The exact interaction depends on the LangChain splitter configuration.',1)]
 ],
 qa:[['Why heading-based chunking?','To preserve the logical structure of the documents rather than dividing everything into unrelated pieces.'],
 ['Why 1,000 characters with 100 overlap?','1,000 was a practical balance between keeping enough information, staying focused, and avoiding too much context. The 100-character overlap helps keep continuity when information falls across a chunk boundary.'],
 ['How do heading splits and the size limit work together?','Headings preserve structure, while the maximum size and overlap control how longer sections are divided. The exact behaviour depends on the splitter configuration, which is not recorded.']]});

C('meta',{title:'Metadata Management',sub:'Source · page · section',lane:'ingest',group:'docproc',icon:'tag',
 short:'Preserves each chunk\'s origin through processing and retrieval so that answers can be traced to their source.',
 tags:['metadata','source','page number','section heading','traceability'],io:['Document details from extraction','Metadata attached to each chunk'],
 secs:[['Fields preserved',KV([['Document source','Original PDF filename or source identifier'],['Page number','Page where the information originated'],['Section heading','Section of the document containing the information']],['Field','Description'])],
 ['Why it matters',P('I preserved source metadata during document processing and retrieval. The metadata is stored in ChromaDB, included in the prompt context, and lets employees trace answers back to original documents. It also identifies which records to remove when a document is updated.')]],
 qa:[['How did citations work end to end?','Metadata (filename, page, section) was preserved through processing, stored in ChromaDB, and included in the prompt. Gemini was instructed to reference the source documents.']]});

C('embed',{title:'Gemini Embedding',sub:'gemini-embedding-001',lane:'ingest',icon:'vector',
 short:'Converts document chunks into numerical vectors so that retrieval can compare semantic meaning.',
 tags:['embedding','vectors','gemini-embedding-001','Google','Arabic','English','multilingual'],io:['Text chunks','Embedding vectors'],
 secs:[
  ['What is an embedding?',P('A numerical representation of text that helps the retrieval system compare semantic meaning.')+P('Example: <i>"How much revenue did the company generate?"</i> and <i>"What were the company\'s total earnings?"</i> use different words but have similar meanings. An embedding model helps identify this similarity.')],
  ['Why this model?',KV([['Retrieval quality','Strong capabilities for semantic retrieval and multilingual content, including English and Arabic.'],['Cost','The company already had an agreement with Google that provided API access at a lower cost.'],['Integration','Could be integrated into the existing LangChain pipeline, making implementation straightforward.']])+P('Overall, a practical balance between retrieval quality, multilingual support, cost and ease of integration.')],
  ['Configuration',KV([['Model','<code>gemini-embedding-001</code>'],['Provider','Google'],['Output dimensionality',NR()]])]
 ],
 qa:[['Why gemini-embedding-001?','Three reasons: strong semantic retrieval with multilingual support including English and Arabic, lower-cost API access through the company\'s agreement with Google, and straightforward LangChain integration.']]});

C('chroma',{title:'ChromaDB',sub:'Vectors + text + metadata',lane:'ingest',icon:'db',
 short:'The vector database that stores and searches embeddings together with original text and source metadata.',
 tags:['vector database','FAISS','Qdrant','Pinecone','similarity search'],io:['Embeddings, text, metadata','Semantically similar chunks'],
 secs:[
  ['Stored record',KV([['Embedding','Numerical vector representing the chunk'],['Text','Original content of the chunk'],['Document source','Original PDF filename or source identifier'],['Page number','Page where the information originated'],['Section heading','Section of the document containing the information']],['Field','Description'])],

const PITCH=`<p>During my AI Engineering internship at Orange Jordan, I developed a database-integrated RAG system that allowed employees of a client company to ask questions about information stored in their internal PDF documents.</p>
<p>I used LangChain and Unstructured to extract the PDF content, applied Python-based text cleaning, and divided the documents into heading-based chunks with a maximum size of 1,000 characters and 100 characters of overlap. I generated embeddings using Google's <code>gemini-embedding-001</code> model and stored them in ChromaDB alongside their original text and source metadata.</p>
<p>For information retrieval, I implemented a hybrid approach combining 70% dense retrieval and 30% BM25 keyword retrieval, using LangChain's <code>EnsembleRetriever</code> with Reciprocal Rank Fusion. The five highest-ranked chunks were passed to Google Gemini using a Stuffing-based prompt containing instructions, retrieved context and the employee's question. The model was instructed to generate grounded answers, acknowledge insufficient information and reference the original documents.</p>
<p>I contributed to the FastAPI backend and used Docker, Poetry and Uvicorn for application packaging, dependency management and server execution. I evaluated the system using the company's internal ground-truth dataset: Python scripts measured retrieval quality, while RAGAS evaluated faithfulness and other answer-quality metrics.</p>
<p><b>The final system achieved 91% Hit Rate@5, 89% Recall@5 and 93% faithfulness.</b> I developed the pipeline under senior engineering supervision, while other team members handled the frontend and final deployment.</p>`;

function hl(src,lang){const R={python:/(#[^\n]*)|("[^"\n]*"|'[^'\n]*')|\b(from|import|for|in|if|def|return)\b|\b(\d+(?:\.\d+)?)\b|\b(EnsembleRetriever|retrieve|set|len|sum)\b/g,

 const re=R[lang];if(!re)return esc(src);let out='',last=0,m;re.lastIndex=0;
 while((m=re.exec(src))){if(!m[0]){re.lastIndex++;continue}out+=esc(src.slice(last,m.index));let c;
  if(lang==='json')c=m[2]?'p':m[4]?'s':'n';else c=m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'n':'p';
  out+=`<span class="t-${c}">${esc(m[0])}</span>`;last=m.index+m[0].length}

  const go=t.closest('[data-go]');if(go&&go.dataset.go&&!go.closest('#canvas')){e.preventDefault();stopTrace();select(go.dataset.go);return}
  if(t.closest('[data-close]')){closePanel();return}
  const v=t.closest('[data-view]');if(v){stopTrace();setView(v.dataset.view);return}
  const pt=t.closest('[data-ptab]');if(pt){state.ptab=pt.dataset.ptab;renderPanel();return}
  const kn=t.closest('[data-known]');if(kn){const id=kn.dataset.known;known.has(id)?known.delete(id):known.add(id);store.set('rag.known',[...known]);const q=kn.closest('.qa');q.classList.toggle('known',known.has(id));kn.classList.toggle('done',known.has(id));kn.textContent=known.has(id)?'Reviewed':'Mark as reviewed';if(q.closest('#v-interview')){const op=[...$$('#v-interview details[open]')].map(d=>d.dataset.q);renderInterview();op.forEach(o=>{if(o){const d=$(`#v-interview [data-q="${CSS.escape(o)}"]`);if(d)d.open=true}})}return}
  const tr=t.closest('[data-trace]');if(tr){trace(tr.dataset.trace);return}
  const tb=t.closest('[data-t]');if(tb){const a=tb.dataset.t;if(a==='in')zoomAt(1.2);if(a==='out')zoomAt(1/1.2);if(a==='fit')fit();if(a==='full')toggleFs();if(a==='shut'){Object.keys(GROUPS).forEach(g=>state.collapsed.add(g));store.set('rag.collapsed',[...state.collapsed]);renderScene()}if(a==='open'){state.collapsed.clear();store.set('rag.collapsed',[]);renderScene()}return}
  if(t.closest('#outlineBtn')){$('#outline').classList.toggle('on');$('#outlineBtn').classList.toggle('on');state.touched=false;return}
  if(t.closest('.brand')){select('project');return}
  const mt_=t.closest('[data-metric]');if(mt_){evalSel=mt_.dataset.metric;renderEval();$$('.gauge .va').forEach(c=>c.style.strokeDasharray=`${2*Math.PI*36*c.dataset.v/100} ${2*Math.PI*36}`);return}
  const sf=t.closest('[data-sf]');if(sf){renderStack(sf.dataset.sf);return}const df=t.closest('[data-df]');if(df){renderDecisions(df.dataset.df);return}
  const iff=t.closest('[data-if]');if(iff){ivf=iff.dataset.if;renderInterview();return}
  if(t.closest('[data-ihide]')){ivHide=!ivHide;renderInterview();return}
  if(t.closest('[data-ishuf]')){const m=new Map;ivOrder=k=>{if(!m.has(k))m.set(k,Math.random());return m.get(k)};renderInterview();return}
  if(t.closest('[data-ireset]')){known.clear();store.set('rag.known',[]);renderInterview();return}
  const r=t.closest('[data-res]');if(r){pick(+r.dataset.res);return}
  if(!t.closest('.search'))$('#results').classList.remove('on')});
 $$('#v-contrib').forEach(v=>v.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.go)select(e.target.dataset.go)}));
 const q=$('#q');q.addEventListener('input',()=>runSearch(q.value));q.addEventListener('focus',()=>q.value&&runSearch(q.value));
 q.addEventListener('keydown',e=>{const b=$$('#results [data-res]');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!b.length)return;b[sIdx].classList.remove('sel');sIdx=(sIdx+(e.key==='ArrowDown'?1:b.length-1))%b.length;b[sIdx].classList.add('sel');b[sIdx].scrollIntoView({block:'nearest'})}if(e.key==='Enter')pick(sIdx);if(e.key==='Escape'){q.value='';runSearch('');q.blur()}});
 $('#themeBtn').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
 document.addEventListener('keydown',e=>{const ty=/INPUT|SELECT|TEXTAREA/.test(e.target.tagName);if(e.key==='/'&&!ty){e.preventDefault();q.focus();return}if(ty)return;
  if(e.key==='Escape'){if(state.sel)closePanel();else if(document.body.classList.contains('fs'))toggleFs();stopTrace()}
  if(state.view==='blueprint'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){if(e.key==='ArrowRight'&&state.sel)step(1);if(e.key==='ArrowLeft'&&state.sel)step(-1);if(e.key==='+'||e.key==='=')zoomAt(1.2);if(e.key==='-')zoomAt(1/1.2);if(e.key==='0')fit();if(e.key==='f'||e.key==='F')toggleFs()}});
 document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs')){document.body.classList.remove('fs');setTimeout(()=>{state.touched=false;fit()},120)}});
 addEventListener('hashchange',route_);
 if(innerWidth<=760&&!location.hash.startsWith('#/c/')){$('#outline').classList.add('on');$('#outlineBtn').classList.add('on')}
 requestAnimationFrame(()=>{fit(0);route_()});
}
boot();
